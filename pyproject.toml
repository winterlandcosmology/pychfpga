[build-system]
    requires = [
        "setuptools>=64,<82", # >=64 required for setuptools-scm, <82 required for pymeasure (pulled in py labpy) because of missing pkg_resources
        "setuptools-scm>=9", # automatically manages version number from git. >=9 keeps the +<platform>_<config> tag suffix
        "wheel"
        ]
    build-backend = "setuptools.build_meta"

[project]
    name = "pychfpga"
    description = "Operates array of FPGA boards used for implementing small and large scale radiotelescopes"
    classifiers= [
        "Programming Language :: Python :: 3",
        "Operating System :: OS Independent",
        "Topic :: Scientific/Engineering :: Astronomy",
        "Intended Audience :: Science/Research",
        ]
    dynamic=["version"]
    authors = [
        { name = "McGill University"},
        { name = "JF Cliche", email = "vhdl@jfcliche.com" }
        ]
    requires-python = "==3.12.*"
    readme = "README.rst"

    dependencies = [
        "setuptools>=64,<82", # required by setuptools-scm, <82 required for pymeasure (pulled in py labpy) because of missing pkg_resources
        "setuptools-scm>=9",

        # Private packages
        "wtl.namespace @ git+https://git@bitbucket.org/winterlandcosmology/wtl.namespace.git",  # testing 1.1.0
        "wtl.metrics @ git+https://git@bitbucket.org/winterlandcosmology/wtl.metrics.git",  # testing 1.1
        "wtl.log @ git+https://git@bitbucket.org/winterlandcosmology/wtl.log.git",  # testing 1.1.0
        "wtl.rest @ git+https://git@bitbucket.org/winterlandcosmology/wtl.rest.git",
        "wtl.config @ git+https://git@bitbucket.org/winterlandcosmology/wtl.config.git",
        "wtl.h5-archive @ git+https://git@bitbucket.org/winterlandcosmology/wtl.h5-archive.git",   # was @v1.0.3, testing 1.1.0

        # PyPi packages
        "aiohttp",  # new, using 3.7.2
        "ujson",  # new , using 3.17.2 (Tuber)
        "freetype-py", # For CRS LCD fonts
        "numpy",  # was ==1.15.2, testing 1.19.2
        "h5py",  # was ==2.8.0, testing 3.0.0
        "matplotlib",  # was ==2.2.3, now testing 3.3.2
        "PyYAML",  # was 3.13, testing 5.3.1
        "psutil",  # was ==5.4.7, now testing 5.7.3
        "netifaces",   # was not specified, now using 0.10.9
        "ifaddr",  # new, using 0.1.7, should replace netifaces
        "xmodem",  # CRS U-Boot netconsole firmware upload
        "zeroconf==0.34.3",  # new, was tested with 0.34.3
        ]
# also need for jupyter notebooks
        # jupyter
        # ipympl # for widgets
[project.urls]
    # Homepage = "https://example.com"
    Documentation = "https://winterlandcosmology.github.io/pychfpga/jfc/dev"
    Repository = "https://github.com/winterlandcosmology/pychfpga.git"
    # Issues = "https://github.com/me/spam/issues"
    # Changelog = "https://github.com/me/spam/blob/master/CHANGELOG.md"

# [tool.setuptools]
# packages = ["pychfpga"]

[tool.setuptools.package-data]

    # Runtime data opened relative to the modules. IceBoard SD card images (*.img.bz2) are not
    # included: they are written to SD cards from a checkout.
    pychfpga = [
        "*.bit",
        "*.yaml",
        "fpga_firmware/bitstreams/*.bit",
        "adc_delay_tables/*.yaml",
        "hardware/crs/arm_firmware/*.elf",
        "hardware/crs/arm_firmware/uboot.bin",
        "hardware/crs/arm_firmware/fwupgrade.py",
        "hardware/crs/arm_firmware/CRS_arm_firmware_README.txt",
        "hardware/zcu111/pll_config_files/*",
        "hardware/i2c_devices/ssd1306/*.ttf",
        ]

# setuptools-scm adds every git-tracked file when building from a git checkout
[tool.setuptools.exclude-package-data]
    "pychfpga.hardware.ice" = ["arm_firmware/*.img.bz2"]


[tool.setuptools.packages.find]
    where = ["."]  # Don't include packages in qc or docs
    exclude = ["tests", "docs", "old-scripts"]
    namespaces = false

[tool.setuptools_scm]
    version_file = "pychfpga/_version_scm.py"

[tool.pylint.main]
# recursive = true
# source-roots = ["pychfpga/"]
py-version =  "3.8"  # qc had issues with 3.7 and 3.9
ignore = ["unused"]

# jobs will specify the number of cores to run pylint with
# jobs = 0 will autodetect the number of available cores

jobs = 0

[tool.pylint."messages control"]
disable = ["raw-checker-failed",
            "possibly-used-before-assignment",
            "bad-inline-option",
            "locally-disabled",
            "file-ignored",
            "suppressed-message",
            "useless-suppression",
            "deprecated-pragma",
            "use-implicit-booleaness-not-comparison-to-string",
            "use-implicit-booleaness-not-comparison-to-zero",
            "use-symbolic-message-instead"
            ]
errors-only = true



[project.optional-dependencies]
    ber_dashboard = [  # pychfpga.apps.ber_dashboard (python -m pychfpga.apps.ber_dashboard)
        "PyQt6",
        "pyqtgraph",
        "matplotlib",
        ]

    docs = [
        "sphinx",
        "sphinx_rtd_theme",
        "sphinxcontrib.restbuilder",  # used for debugging outputs
        ]

    qc = [
        # Private packages
        "wtl.pytest-xreport @ git+https://git@bitbucket.org/winterlandcosmology/wtl.pytest-xreport.git@1.4",
        "labpy @ git+https://git@bitbucket.org/winterlandcosmology/labpy.git@qc",
        "psucontrol @ git+https://github.com/t0/psucontrol.git@main",  # CRS crate PSU control in qc/CRS_crate

        # Pypi packages
        "numpy",
        "matplotlib",
        "prettytable",

        # test-specific packages
        "pyserial", # (tested with 0.0.97 on Ubuntu) for memtest
        "pyftdi", # (tested with 0.53.3 on Ubuntu) tested with for PLL programming. Newer versions have another interface
        "pytest-asyncio", # Needed for MTU test in firmware tests
        "pytest>=8,<9", # pytest 9 not yet validated with wtl.pytest-xreport; 8.x is known-good
        "pytest-html>=4.0", # xreport requires 4.x; do not downgrade to 3.x (incompatible data format)
        ]

[project.scripts]
    fpga_master = "pychfpga.fpga_master:main"
    raw_acq = "pychfpga.raw_acq.__main__:main"
    pychfpga_gps = "pychfpga.gps:main"
    pychfpga_ps = "pychfpga.ps:main"
    chime_raw_acq = "pychfpga.raw_acq.__main__:main"  # deprecated, use raw_acq instead
    pychfpga_raw_acq = "pychfpga.raw_acq.__main__:main"  # deprecated, use raw_acq instead
    crs_discover = "pychfpga.hardware.crs.discover:main"