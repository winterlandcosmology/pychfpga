[pytest]
# Async tests share one event loop for the whole session (one Tuber HTTP session per run).
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
addopts = --capture=tee-sys --xreport-path="../../../qc_results/{model}/{model}_SN{serial}/{isodate}_{session_name}.xml"

# needed to include all stdout text into the xml report

junit_logging = all

