
clone:
  lfs: true  # make sure LFS files are fetched, otherwise we don't have our images...

definitions:
  caches:
    uv-cache:
      key:
        files:
          - docs/uv.lock
      path: ~/.cache/uv

pipelines:
  # Pull request pipeline
  # Validation of pull requests into the main deployment branch
  pull-requests:
    '**':
      - step:
          name: Automatic static code analysis
          image: bitbucketpipelines/uv-cli-setup:latest
          # Test which require no configuaration of hardware components and are therefore platform agnostic
          # This test will ensure that none of the modifications made into the deploy branch cause any disturbances to other elements of the project
          caches:
            - uv-cache
          script:
            #the errors only tags limits the scope of the linter to purely functional errors and ignores style concerns
            - make lint
  branches:
    '{master,develop,jfc/dev}':
      - step:
          name: Build and publish documentation
          image: bitbucketpipelines/uv-cli-setup:latest
          caches:
            - uv-cache
          script:
            - DOC_REPO='winterlandcosmology.bitbucket.io'
            - DOC_REPO_URL='git@bitbucket.org:winterlandcosmology/'$DOC_REPO'.git'
            - DOC_SPHINX_ROOT_FOLDER='docs'
            - DOC_BUILD_FOLDER='build'
            - DOC_PUBLISH_FOLDER='pychfpga/'$BITBUCKET_BRANCH
            - cd docs && uv sync --locked
            - cd ..
            - echo 'Building for '$BITBUCKET_REPO_SLUG/$BITBUCKET_BRANCH
            - make docs
            - cd $DOC_SPHINX_ROOT_FOLDER
            - cd $DOC_BUILD_FOLDER
            - git clone $DOC_REPO_URL
            - rm -rf $DOC_REPO/$DOC_PUBLISH_FOLDER/*
            - mkdir -p $DOC_REPO/$DOC_PUBLISH_FOLDER
            - cp -r html/* $DOC_REPO/$DOC_PUBLISH_FOLDER/
            - cd $DOC_REPO
            - git config --global user.email "bb-pipelines@jfcliche.com"
            - git config --global user.name "BitBucket Pipelines ($BITBUCKET_REPO_SLUG/$BITBUCKET_BRANCH)"
            - git add --all $DOC_PUBLISH_FOLDER
            - git diff-index --quiet HEAD -- || git commit -a -m "bitbucket-pipelines updated $BITBUCKET_BRANCH branch into $DOC_PUBLISH_FOLDER sphinx-generated documentation"
            - git push
