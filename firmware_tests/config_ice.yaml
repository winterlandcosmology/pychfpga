connection_config:
    prog: 1                 # 0 - do not reprogram, 1 - reprogram if outdated, 2 - always reprogram
    mode: 'corr16'          # Do not change for a single board
    hwm: 'mb 509'           # For a different board change the serial number
    # bitfile: /home/vbidula/pychfpga/pychfpga/fpga_firmware/bitstreams/chfpga_ice_corr16.bit
    bitfile: /home/vbidula/pychfpga/pychfpga/fpga_firmware/bitstreams/chfpga_ice_corr16_pbg_jun16.bit

test_config:
    loglevelconn: "INFO"   # Log level during connection to the board
    logleveltest: "DEBUG"   # Log level during tests
    loglevelrecv: 1        # 0-3
    conn_scope: "class"     # Select "function" to re-establish connection for each test or
                            # "class" if you want to reuse connection.
    only_plot: False              #Don't compare results, only plot them

    # FPGA modes each test module may run in. connection_config.mode must be
    # in the list or that module's tests are skipped.
    supported_modes:
        scaler_test: [corr16]
        funcgen_test: [corr16]
        fft_test: [corr16]
        corr_test: [corr16]

    # GPIO / firmware geometry for collection-time eval. Must match the live
    # board (post-connect assert). CAPTURE_WIDTH is the test capture path.
    constants:
        PLATFORM: MGK7MB
        ADC_BITS_PER_SAMPLE: 8
        NUM_CHANNELS: 16
        SAMPLES_PER_FRAME: 2048
        NUM_BINS: 1024
        FFT_WIDTH: 18
        BINS_PER_WORD: 2
        CAPTURE_BUS_WIDTH: 32
        CAPTURE_WIDTH: 4

    #parameters for scaler tests 
    platform: 'ICE-8bit-r'
    rtol: 0.015
    global_postscaler: range(IDENTITY_POSTSCALER - 1, IDENTITY_POSTSCALER + 2) #range(SCALER_SHIFT - INPUT_WIDTH - IMPLICIT_SHIFT + 1, SCALED_WIDTH - IMPLICIT_SHIFT)
    global_frame_cnt: [100, 30000]
    alternating_gain:
        period: range(1, 20, 2)
    constant_gain:
        gain: [3, 65535]
        #gain: [-3, 32767]
    rounding:
        value: [-8, 7]
    double_resolution_capture:
        postscaler: range(12, 22)
    averages:
        num_frames: [120]
        postscaler_range: ((IDENTITY_POSTSCALER - CAPTURE_WIDTH, IDENTITY_POSTSCALER + CAPTURE_WIDTH),)

    #parameters for funcgen tests
    global_seeds: [-7680, 7744, -14296, -65, -32175, -29190, 30160, 5679, -2070, 24601, 29784, -18765, -25554, -10744, -27608, 3207, 5129, 5031, 22606, 11371, 2446, -28089, 29554, -24103, -26437, 18246, -6527, 10486, -25707, -5372, -16068, 25810, 14648, 23623, 4812, 4715, -2645, -28820, -15584, 13563, 32522, 31152, 17351, -22105, -2246, 25818, 17051, -2280, -25287, -20404, -15797, -12642, -15709, -31140, 7986, 22594, -6864, -32133, 11524, -4534, -11304, 16974, -14582, -19158, -30167, 18625, 24000, -12775, -2598, 10724, -17769, -6480, -21887, -20074, -20059, 14521, -5225, 4359, 6366, 30513, -25340, 4396, -224, -4468, 28533, -14307, 13536, -24931, 20594, -30438, -10245, -4246, 25084, -3154, 26509, -16821, -1224, 10499, -16869, -1795]
    # TODO: is iceboard supposed to send multiple frames per burst? I hardcoded 1...
    #global_frames_per_burst: [1]
    global_number_of_bursts: [4, 5, 6, 7, 8, 9, 10]
    global_burst_period_in_frames: [10000]

    #funcgen test functions with parameters
    funcgen_noise_fft_avg_squared:
        num_runs: [100]
    right_shift: 
        shift: [0,1,2,3,4]
    shift_clip_width:
        shift: [5]
        clip_width: [5]
    frame_counter_nibble:
        burst_period_in_frames: [4001]
    overflow_ctr: 
        expected_overflows_per_frame: [0, 1, 1000, 2000]
        stats_frames: [10]
        mode: ['word_ctr_buffer_flags', 'frame8', 'frame4']
