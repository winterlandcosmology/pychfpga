# Documentation build environment (Sphinx only — not the full pychfpga runtime).
# Private wtl.* packages are mocked in source/conf.py for autodoc.

[build-system]
    requires = [
        "setuptools>=64,<82",
        "setuptools-scm>=8.0",
        "wheel",
        ]
    build-backend = "setuptools.build_meta"

[project]
    name = "pychfpga_docs"
    description = "Documentation builder for pychfpga"
    dynamic = ["version"]
    authors = [
        { name = "JF Cliche", email = "vhdl@jfcliche.com" },
        ]
    requires-python = "==3.12.*"
    dependencies = [
        "setuptools>=64,<82",
        "setuptools-scm>=8.0",
        "sphinx",
        "sphinx_rtd_theme",
        "sphinxcontrib.restbuilder",
        # Imported by pychfpga modules during autodoc (PyPI only)
        "numpy",
        "matplotlib",
        "h5py",
        "PyYAML",
        "aiohttp",
        "psutil",
        "netifaces",
        "zeroconf==0.34.3",
        "ujson",
        "nest_asyncio",
        "freetype-py",
        "xmodem",
        ]

[tool.setuptools.packages.find]
    where = ["."]
    exclude = ["source", "build"]

[tool.setuptools_scm]
    version_file = "source/_version.py"
    root = ".."
