x-pychfpga-build: &pychfpga_build
  context: .
  dockerfile: Dockerfile
  args:
    PYCHFPGA_VERSION: ${PYCHFPGA_VERSION:-0+docker}
  ssh:
    - default=${PYCHFPGA_SSH_KEY_PATH}

services:
  raw_acq:
    build: *pychfpga_build
    image: ${PYCHFPGA_IMAGE}
    command: ["chime_raw_acq"]
    network_mode: host
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - "${PYCHFPGA_DATA_DIR}:/data"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:54322/status >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  fpga_master:
    build: *pychfpga_build
    image: ${PYCHFPGA_IMAGE}
    command: ["/bin/bash", "/pychfpga/docker/start_fpga_master.sh"]
    network_mode: host
    restart: unless-stopped
    depends_on:
      raw_acq:
        condition: service_healthy
    environment:
      PYTHONUNBUFFERED: "1"
      PYCHFPGA_CONFIG_NAME: "${PYCHFPGA_CONFIG_NAME}"
      PYCHFPGA_WAIT_HOSTS: "${PYCHFPGA_WAIT_HOSTS}"
      PYCHFPGA_WAIT_PING_TIMEOUT: "${PYCHFPGA_WAIT_PING_TIMEOUT:-1}"
      PYCHFPGA_WAIT_TIMEOUT: "${PYCHFPGA_WAIT_TIMEOUT:-}"
    volumes:
      - "${PYCHFPGA_DATA_DIR}:/data"
      - "${PYCHFPGA_CONFIG_FILE}:/config/fpga_config.yaml:ro"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:54321/status | grep -Eq '\"is_ready\"[[:space:]]*:[[:space:]]*true'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 15s

  fpga_watchdog:
    image: docker:cli
    restart: unless-stopped
    depends_on:
      raw_acq:
        condition: service_started
      fpga_master:
        condition: service_started
    working_dir: /workspace
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/workspace:ro
      - "${PYCHFPGA_DATA_DIR}:/data"
    environment:
      PYCHFPGA_DATA_DIR: "/data"
      WATCHDOG_LOG_FILE: "/data/swartfontein-data/current/fpga_master_debug.log"
      WATCHDOG_ACTION_LOG: "/data/swartfontein-data/current/fpga_watchdog.log"
      WATCHDOG_POLL_INTERVAL_SEC: "${WATCHDOG_POLL_INTERVAL_SEC:-5}"
      WATCHDOG_RESTART_DELAY_SEC: "${WATCHDOG_RESTART_DELAY_SEC:-60}"
      WATCHDOG_COOLDOWN_SEC: "${WATCHDOG_COOLDOWN_SEC:-20}"
      WATCHDOG_RAW_HEALTH_TIMEOUT_SEC: "${WATCHDOG_RAW_HEALTH_TIMEOUT_SEC:-90}"
      WATCHDOG_DRY_RUN: "${WATCHDOG_DRY_RUN:-0}"
      WATCHDOG_STATE_DIR: "/tmp/fpga-watchdog"
    command:
      - /bin/sh
      - -lc
      - |
        while true; do
          /workspace/scripts/docker/watch_fpga_errors.sh
          sleep "$${WATCHDOG_POLL_INTERVAL_SEC:-5}"
        done
