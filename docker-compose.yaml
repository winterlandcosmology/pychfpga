x-pychfpga-build: &pychfpga_build
  context: .
  dockerfile: Dockerfile
  args:
    PYCHFPGA_VERSION: ${PYCHFPGA_VERSION:-0+docker}
  ssh:
    - default=${PYCHFPGA_SSH_KEY_PATH}

services:
  raw_acq:
    build: *pychfpga_build
    image: ${PYCHFPGA_IMAGE}
    command: ["chime_raw_acq"]
    network_mode: host
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - "${PYCHFPGA_DATA_DIR}:/data"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:54322/status >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  fpga_master:
    build: *pychfpga_build
    image: ${PYCHFPGA_IMAGE}
    command: ["/bin/bash", "/pychfpga/docker/start_fpga_master.sh"]
    network_mode: host
    restart: unless-stopped
    depends_on:
      raw_acq:
        condition: service_healthy
    environment:
      PYTHONUNBUFFERED: "1"
      PYCHFPGA_CONFIG_NAME: "${PYCHFPGA_CONFIG_NAME}"
      PYCHFPGA_WAIT_HOSTS: "${PYCHFPGA_WAIT_HOSTS}"
      PYCHFPGA_WAIT_PING_TIMEOUT: "${PYCHFPGA_WAIT_PING_TIMEOUT:-1}"
      PYCHFPGA_WAIT_TIMEOUT: "${PYCHFPGA_WAIT_TIMEOUT:-}"
    volumes:
      - "${PYCHFPGA_DATA_DIR}:/data"
      - "${PYCHFPGA_CONFIG_FILE}:/config/fpga_config.yaml:ro"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:54321/status | grep -Eq '\"is_ready\"[[:space:]]*:[[:space:]]*true'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 15s
